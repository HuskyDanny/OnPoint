<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 700" width="1280" height="700"
     role="img" aria-label="On Point: the shape of an answer changes — line one is the idea, line two is the one next action, and everything after it is terse. Two axes, a never-compressed list, and one install for every agent.">
<title>On Point — the idea, the move, then nothing else</title>
<desc>Four panels. One: the same answer twice. A normal agent spreads eight lines of prose with the one thing to do buried inside; On Point puts the idea on line one, the one next action on line two, and keeps the rest short. Two: two axes — essence first governs the shape of the answer, say less governs the words inside it, and the order is a dependency because you cannot compress an idea you have not named. Three: the never-compressed list — technical substance, exact error strings, code, security, input validation, accessibility, and anything asked for in full. Four: one install covers Claude Code, Codex, Gemini CLI, Cursor, Windsurf, Cline, Copilot, Kiro, Qoder, OpenCode, OpenClaw, Devin and anything reading AGENTS.md, with no config to set.</desc>

<defs>
  <filter id="rough" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="3" seed="11" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <marker id="aha" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#c2410c"/>
  </marker>

  <style>
    .ink  { stroke:#1f2328; fill:none; stroke-width:2; stroke-linejoin:round; stroke-linecap:round; }
    .thin { stroke:#8b8680; fill:none; stroke-width:1.4; }
    .acc  { stroke:#c2410c; fill:none; stroke-width:2.4; }
    .paper   { fill:#fdfcf8; }
    .chip    { fill:#f4f1ea; stroke:#1f2328; stroke-width:1.6; }
    .accfill { fill:#fdeee4; stroke:#c2410c; stroke-width:2; }
    .dark    { fill:#1f2328; }

    text { font-family:ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif; fill:#1f2328; }
    .h1  { font-size:30px; font-weight:700; letter-spacing:-0.6px; }
    .sub { font-size:14px; fill:#6b6660; }
    .pt  { font-size:15px; font-weight:700; }
    .lb  { font-size:13px; }
    .sm  { font-size:11.5px; fill:#6b6660; }
    .num { font-size:13px; font-weight:700; }
    .accy{ fill:#c2410c; }

    /* dashes travelling along the arrow — the before becoming the after */
    .flow { stroke-dasharray:7 7; animation:flow 1.1s linear infinite; }
    @keyframes flow { to { stroke-dashoffset:-14; } }

    /* the buried point, still down there, still not found */
    .buried { animation:buried 5s ease-in-out infinite; }
    @keyframes buried { 0%,60% {opacity:.35;} 78% {opacity:1;} 92%,100% {opacity:.35;} }

    /* the two axes light up in order: name it, then cut it */
    .ax  { opacity:.6; animation:ax 5s ease-in-out infinite; }
    .ax1 { animation-delay:0s; } .ax2 { animation-delay:1.2s; }
    @keyframes ax { 0%,4% {opacity:.6;} 14%,34% {opacity:1;} 50%,100% {opacity:.6;} }

    /* the mark, once per cycle: a drop lands, scatters, resolves to a point */
    .m1 { animation:m 5s ease-in-out infinite; animation-delay:0s; }
    .m2 { animation:m 5s ease-in-out infinite; animation-delay:.45s; }
    .m3 { animation:m 5s ease-in-out infinite; animation-delay:.9s; }
    @keyframes m { 0%,6% {opacity:.25;} 16%,64% {opacity:1;} 80%,100% {opacity:.25;} }

    @media (prefers-reduced-motion:reduce) {
      .flow,.buried,.ax,.m1,.m2,.m3 { animation:none; }
      .ax,.m1,.m2,.m3 { opacity:1; } .buried { opacity:.6; }
    }
  </style>
</defs>

<rect width="1280" height="700" class="paper"/>
<rect x="6" y="6" width="1268" height="688" rx="10" fill="none" stroke="#e4e0d6" stroke-width="2"/>

<!-- ══════════════ shapes (wobbled) ══════════════ -->
<g filter="url(#rough)">
  <path class="ink" d="M40 78 L420 78" stroke-width="4"/>

  <rect class="ink" x="40"  y="104" width="720" height="300" rx="10"/>
  <rect class="ink" x="790" y="104" width="450" height="300" rx="10"/>
  <rect class="ink" x="40"  y="432" width="720" height="228" rx="10"/>
  <rect class="ink" x="790" y="432" width="450" height="228" rx="10"/>

  <g class="ink"><circle cx="66" cy="130" r="13"/><circle cx="816" cy="130" r="13"/><circle cx="66" cy="458" r="13"/><circle cx="816" cy="458" r="13"/></g>

  <!-- ① left: a normal answer, spread out -->
  <g class="thin">
    <path d="M58 186 L372 186"/><path d="M58 210 L356 210"/><path d="M58 234 L368 234"/>
    <path d="M58 258 L330 258"/><path d="M58 306 L362 306"/><path d="M58 330 L344 330"/>
  </g>
  <path class="acc buried" d="M58 282 L214 282"/>

  <!-- becoming -->
  <path class="acc flow" d="M392 258 L424 258" marker-end="url(#aha)"/>

  <!-- ① right: the same answer, on point -->
  <rect class="accfill" x="446" y="174" width="296" height="26" rx="6"/>
  <rect class="accfill" x="446" y="210" width="234" height="26" rx="6"/>
  <g class="thin">
    <path d="M446 262 L676 262"/><path d="M446 286 L642 286"/><path d="M446 310 L588 310"/>
  </g>

  <!-- ② two axes -->
  <g class="ax ax1"><rect class="chip"    x="808" y="170" width="150" height="38" rx="7"/></g>
  <g class="ax ax2"><rect class="accfill" x="808" y="266" width="150" height="38" rx="7"/></g>
  <path class="thin" d="M808 348 L1222 348" stroke-dasharray="6 5"/>

  <!-- ③ never compressed -->
  <g class="chip">
    <rect x="58"  y="490" width="152" height="34" rx="7"/>
    <rect x="222" y="490" width="152" height="34" rx="7"/>
    <rect x="386" y="490" width="112" height="34" rx="7"/>
    <rect x="510" y="490" width="112" height="34" rx="7"/>
    <rect x="58"  y="536" width="192" height="34" rx="7"/>
    <rect x="262" y="536" width="160" height="34" rx="7"/>
    <rect x="434" y="536" width="140" height="34" rx="7"/>
  </g>

  <!-- ④ one install -->
  <path class="thin" d="M808 610 L1222 610" stroke-dasharray="6 5"/>
</g>

<!-- ══════════════ the mark: drop · splash · point ══════════════ -->
<g transform="translate(1128 44) scale(.42)" fill="#1f2328">
  <path class="m1" d="M-118 -34 C-118 -34 -100 -4 -100 10 A18 18 0 1 1 -136 10 C-136 -4 -118 -34 -118 -34 Z"/>
  <g class="m2">
    <circle cx="-24" cy="0" r="8"/>
    <g stroke="#1f2328" stroke-width="5" stroke-linecap="round" fill="none">
      <path d="M-8 8 L6 14"/>   <path d="M-17 17 L-11 31"/>
      <path d="M-31 17 L-37 31"/><path d="M-40 8 L-54 14"/>
      <path d="M-40 -8 L-54 -14"/><path d="M-31 -17 L-37 -31"/>
      <path d="M-17 -17 L-11 -31"/><path d="M-8 -8 L6 -14"/>
    </g>
    <circle cx="22"  cy="0"   r="4.5"/><circle cx="3"   cy="30"  r="3.5"/>
    <circle cx="-24" cy="46"  r="4.5"/><circle cx="-51" cy="30"  r="3.5"/>
    <circle cx="-70" cy="0"   r="4.5"/><circle cx="-51" cy="-30" r="3.5"/>
    <circle cx="-24" cy="-46" r="4.5"/><circle cx="3"   cy="-30" r="3.5"/>
  </g>
  <circle class="m3" cx="80" cy="0" r="12"/>
</g>

<!-- ══════════════ text (crisp) ══════════════ -->
<g>
  <text class="h1" x="40" y="52">On Point</text>
  <text class="sub" x="176" y="52">the idea, the move, then nothing else</text>
  <text class="sm" x="1080" y="76" text-anchor="end">a drop, a splash, one point</text>

  <text class="num" x="66" y="135" text-anchor="middle">1</text>
  <text class="pt" x="90" y="136">the same answer, twice</text>
  <text class="sm" x="58" y="164">A NORMAL AGENT</text>
  <text class="sm accy buried" x="222" y="286">the one thing to do, in there somewhere</text>
  <text class="sm" x="58" y="366">you read all of it to find the move</text>
  <text class="sm accy" x="446" y="164">ON POINT</text>
  <text class="lb" x="460" y="192">line 1 · the idea</text>
  <text class="lb accy" x="460" y="228">line 2 · the one next action</text>
  <text class="sm" x="742" y="330" text-anchor="end">then terse, and it stops</text>
  <text class="sm" x="446" y="366">you read two lines and you can move</text>

  <text class="num" x="816" y="135" text-anchor="middle">2</text>
  <text class="pt" x="840" y="136">two axes, one switch</text>
  <text class="lb" x="822" y="194">essence first</text>
  <text class="sm" x="972" y="188">the SHAPE of the answer</text>
  <text class="sm" x="972" y="206">name the idea, then the move</text>
  <text class="sm" x="808" y="238">think, then move</text>
  <text class="lb accy" x="822" y="290">say less</text>
  <text class="sm" x="972" y="284">the WORDS inside it</text>
  <text class="sm" x="972" y="302">drop every one that carries none</text>
  <text class="sm" x="808" y="334">speak</text>
  <text class="sm" x="808" y="374">the order is a dependency, not a schedule:</text>
  <text class="sm" x="808" y="392">you cannot compress an idea you have not named</text>

  <text class="num" x="66" y="463" text-anchor="middle">3</text>
  <text class="pt" x="90" y="464">never compressed — not once, not ever</text>
  <text class="lb" x="70" y="512">technical substance</text>
  <text class="lb" x="234" y="512">exact error strings</text>
  <text class="lb" x="398" y="512">code blocks</text>
  <text class="lb" x="522" y="512">security</text>
  <text class="lb" x="70" y="558">input validation</text>
  <text class="lb" x="274" y="558">data-loss handling</text>
  <text class="lb" x="446" y="558">accessibility</text>
  <text class="sm" x="58" y="602">and anything you asked for in full — a report, a walkthrough, per-phase notes</text>
  <text class="sm" x="58" y="626">compression that drops information is not on point, it is wrong — and wrong is</text>
  <text class="sm" x="58" y="642">expensive in a way that verbose never is</text>

  <text class="num" x="816" y="463" text-anchor="middle">4</text>
  <text class="pt" x="840" y="464">install once</text>
  <text class="lb" x="808" y="500">Claude Code</text>   <text class="lb" x="960" y="500">Cursor</text>   <text class="lb" x="1100" y="500">Kiro</text>
  <text class="lb" x="808" y="524">Codex</text>         <text class="lb" x="960" y="524">Windsurf</text> <text class="lb" x="1100" y="524">Qoder</text>
  <text class="lb" x="808" y="548">Gemini CLI</text>    <text class="lb" x="960" y="548">Cline</text>    <text class="lb" x="1100" y="548">OpenCode</text>
  <text class="lb" x="808" y="572">Copilot</text>       <text class="lb" x="960" y="572">Devin</text>    <text class="lb" x="1100" y="572">OpenClaw</text>
  <text class="sm" x="808" y="600">and anything that reads AGENTS.md</text>
  <text class="sm" x="808" y="632">no config · no env var · no state file</text>
  <text class="sm" x="808" y="648">turn an axis off by deleting it</text>
</g>
</svg>
