<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 300" width="1440" height="300"
     role="img" aria-label="verboseless — big idea, fewer words, less code">
<title>verboseless</title>
<defs>
  <style>
    .bar { fill:#fdfcf8; }
    /* The RESTING state is the compressed staircase — that is the logo, and it is
       what the markup widths say, so a still frame or a no-animation renderer sees
       it too. Three equal bars would read as a hamburger icon.
       The animation is a one-time reveal: equal, then compressed, then hold.
       Staggered so it reads as idea, words, code. */
    .b1 { animation:b1 700ms cubic-bezier(.2,.7,.3,1) 250ms 1 both; }
    .b2 { animation:b2 700ms cubic-bezier(.2,.7,.3,1) 400ms 1 both; }
    .b3 { animation:b3 700ms cubic-bezier(.2,.7,.3,1) 550ms 1 both; }
    @keyframes b1 { from {width:210px;} to {width:150px;} }
    @keyframes b2 { from {width:210px;} to {width:96px;}  }
    @keyframes b3 { from {width:210px;} to {width:52px;}  }
    @media (prefers-reduced-motion:reduce) { .b1,.b2,.b3 { animation:none; } }
  </style>
</defs>

<rect width="1440" height="300" fill="#0d0d0f"/>

<!-- the mark: three bars, each compressed further than the last -->
<rect class="bar b1" x="150" y="70"  width="150" height="24" rx="4"/>
<rect class="bar b2" x="150" y="116" width="96"  height="24" rx="4"/>
<rect class="bar b3" x="150" y="162" width="52"  height="24" rx="4"/>

<text x="392" y="178" fill="#fdfcf8"
      font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif"
      font-size="128" font-weight="700" letter-spacing="-4">verboseless</text>
<text x="398" y="228" fill="#8b8680"
      font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif"
      font-size="30" letter-spacing="2.5">BIG IDEA · FEWER WORDS · LESS CODE</text>
</svg>
