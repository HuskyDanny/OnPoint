<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 780" width="1280" height="780"
     role="img" aria-label="How verboseless works: three persona bodies on disk are cat'd by one hook into the tail of the context on every prompt, where two axes govern the shape of the answer and the words inside it.">
<title>verboseless — two axes, one cat</title>
<desc>Five panels. One: three markdown bodies on disk totalling 11.7 KB. Two: one hook script cats them; all three hook events accept plain stdout as context. Three: the injection lands at the tail of the context next to the live turn and is re-fired, whereas CLAUDE.md sits once at the head and decays. Four: three personas govern the first line, the next line, and everything you say, in that order — abstract first names the idea, i-have-adhd names the next action, caveman deletes the filler. Five: a measurement of the arm this repo shipped previously, ponytail plus caveman, across three runs per arm: cost $4.74 to $3.37 per delivery, output 132.5k tokens to 89.5k, and run-to-run variance collapsing from plus or minus 89 cents to plus or minus 8 cents. That arm is no longer what ships.</desc>

<defs>
  <filter id="rough" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="3" seed="11" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#1f2328"/>
  </marker>
  <marker id="aha" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#c2410c"/>
  </marker>

  <style>
    .ink   { stroke:#1f2328; fill:none; stroke-width:2; stroke-linejoin:round; stroke-linecap:round; }
    .thin  { stroke:#8b8680; fill:none; stroke-width:1.4; }
    .acc   { stroke:#c2410c; fill:none; stroke-width:2.4; }
    .paper { fill:#fdfcf8; }
    .chip  { fill:#f4f1ea; stroke:#1f2328; stroke-width:1.6; }
    .accfill { fill:#fdeee4; stroke:#c2410c; stroke-width:2; }

    text { font-family:ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif; fill:#1f2328; }
    .h1 { font-size:30px; font-weight:700; letter-spacing:-0.6px; }
    .sub{ font-size:14px; fill:#6b6660; }
    .pt { font-size:15px; font-weight:700; }
    .lb { font-size:13px; }
    .sm { font-size:11.5px; fill:#6b6660; }
    .mono { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:13px; }
    .num { font-size:13px; font-weight:700; }
    .big { font-size:26px; font-weight:700; fill:#c2410c; }
    .accy { fill:#c2410c; }

    /* dashes travelling along a path — shows something actually moving */
    .flow { stroke-dasharray:7 7; animation:flow 1.1s linear infinite; }
    @keyframes flow { to { stroke-dashoffset:-14; } }

    /* CLAUDE.md at the head: stated once, then fades as the transcript grows */
    .decay { animation:decay 7s ease-in-out infinite; }
    @keyframes decay { 0%,8% {opacity:1;} 62%,100% {opacity:.18;} }

    /* the tail injection: re-fired, so it comes back every cycle */
    .refire { animation:refire 7s ease-in-out infinite; }
    @keyframes refire { 0%,10% {opacity:.15;} 22%,72% {opacity:1;} 88%,100% {opacity:.15;} }
    .ring { transform-origin:center; animation:ring 2.4s ease-out infinite; }
    @keyframes ring { 0% {opacity:.9; transform:scale(.9);} 70%,100% {opacity:0; transform:scale(1.5);} }

    /* the three personas light up in order: idea, then move, then words */
    .ax { opacity:.6; animation:ax 6s ease-in-out infinite; }
    .ax1 { animation-delay:0s; } .ax2 { animation-delay:1.1s; } .ax3 { animation-delay:2.2s; }
    @keyframes ax { 0%,4% {opacity:.6;} 12%,30% {opacity:1;} 45%,100% {opacity:.6;} }

    /* bars draw in left-to-right */
    .bar { stroke-linecap:round; animation:draw 6s ease-out infinite; }
    @keyframes draw { 0% {stroke-dashoffset:var(--l);} 30%,100% {stroke-dashoffset:0;} }

    @media (prefers-reduced-motion:reduce) {
      .flow,.decay,.refire,.ring,.ax,.bar { animation:none; }
      .ax { opacity:1; } .decay { opacity:.5; } .refire { opacity:1; } .ring { opacity:0; }
      .bar { stroke-dashoffset:0; }
    }
  </style>
</defs>

<rect width="1280" height="780" class="paper"/>
<rect x="6" y="6" width="1268" height="768" rx="10" fill="none" stroke="#e4e0d6" stroke-width="2"/>

<!-- ══════════════ shapes (wobbled) ══════════════ -->
<g filter="url(#rough)">
  <path class="ink" d="M40 78 L322 78" stroke-width="4"/>

  <!-- panels -->
  <rect class="ink" x="40" y="104" width="258" height="306" rx="10"/>
  <rect class="ink" x="316" y="104" width="322" height="306" rx="10"/>
  <rect class="ink" x="656" y="104" width="584" height="306" rx="10"/>
  <rect class="ink" x="40" y="432" width="716" height="248" rx="10"/>
  <rect class="ink" x="774" y="432" width="466" height="248" rx="10"/>
  <rect class="thin" x="40" y="702" width="1200" height="58" rx="10" stroke-dasharray="8 6"/>

  <g class="ink"><circle cx="66" cy="130" r="13"/><circle cx="342" cy="130" r="13"/><circle cx="682" cy="130" r="13"/><circle cx="66" cy="458" r="13"/><circle cx="800" cy="458" r="13"/></g>

  <!-- ① three bodies on disk, plus the summary chip -->
  <rect class="chip" x="58" y="158" width="222" height="38" rx="7"/>
  <rect class="chip" x="58" y="204" width="222" height="38" rx="7"/>
  <rect class="chip" x="58" y="250" width="222" height="38" rx="7"/>
  <rect class="chip" x="58" y="296" width="222" height="38" rx="7"/>

  <!-- ① → ② -->
  <path class="ink flow" d="M286 246 L330 246" marker-end="url(#ah)"/>

  <!-- ② the hook -->
  <rect class="chip" x="334" y="156" width="286" height="42" rx="7"/>
  <path class="thin" d="M334 250 L620 250"/>
  <path class="thin" d="M334 292 L620 292"/>
  <path class="thin" d="M334 334 L620 334"/>
  <path class="thin" d="M340 262 L368 262" stroke-dasharray="7 5"/>
  <path class="acc flow" d="M340 304 L368 304"/>
  <path class="thin" d="M340 346 L368 346" stroke-dasharray="7 5"/>

  <!-- ② → ③ -->
  <path class="acc flow" d="M644 246 L678 246" marker-end="url(#aha)"/>

  <!-- ③ the context column -->
  <rect class="ink" x="712" y="152" width="196" height="236" rx="8"/>
  <rect class="chip decay" x="722" y="162" width="176" height="40" rx="6"/>
  <g class="thin">
    <path d="M726 222 L894 222"/><path d="M726 248 L894 248"/>
    <path d="M726 274 L894 274"/><path d="M726 300 L894 300"/>
  </g>
  <rect class="accfill refire" x="722" y="332" width="176" height="46" rx="6"/>
  <circle class="acc ring" cx="734" cy="345" r="7"/>
  <path class="thin" d="M916 182 L946 182"/>
  <path class="acc" d="M916 355 L946 355"/>

  <!-- ④ three personas -->
  <g class="ax ax1"><rect class="chip" x="58" y="490" width="176" height="40" rx="7"/><rect class="accfill" x="262" y="490" width="144" height="40" rx="7"/><path class="acc" d="M238 510 L258 510" marker-end="url(#aha)"/></g>
  <g class="ax ax2"><rect class="chip" x="58" y="546" width="176" height="40" rx="7"/><rect class="accfill" x="262" y="546" width="144" height="40" rx="7"/><path class="acc" d="M238 566 L258 566" marker-end="url(#aha)"/></g>
  <g class="ax ax3"><rect class="chip" x="58" y="602" width="176" height="40" rx="7"/><rect class="accfill" x="262" y="602" width="144" height="40" rx="7"/><path class="acc" d="M238 622 L258 622" marker-end="url(#aha)"/></g>
  <path class="thin" d="M420 500 L420 632" stroke-dasharray="6 5"/>

  <!-- ⑤ measured — bars draw in -->
  <g stroke-linecap="round">
    <line class="bar" x1="912" y1="512" x2="1152" y2="512" stroke="#c9c4ba" stroke-width="9" stroke-dasharray="240" style="--l:240"/>
    <line class="bar" x1="912" y1="530" x2="1083" y2="530" stroke="#c2410c" stroke-width="9" stroke-dasharray="171" style="--l:171"/>
    <line class="bar" x1="912" y1="574" x2="1152" y2="574" stroke="#c9c4ba" stroke-width="9" stroke-dasharray="240" style="--l:240"/>
    <line class="bar" x1="912" y1="592" x2="1074" y2="592" stroke="#c2410c" stroke-width="9" stroke-dasharray="162" style="--l:162"/>
    <line class="bar" x1="912" y1="636" x2="1152" y2="636" stroke="#c9c4ba" stroke-width="9" stroke-dasharray="240" style="--l:240"/>
    <line class="bar" x1="912" y1="654" x2="934" y2="654" stroke="#c2410c" stroke-width="9" stroke-dasharray="22" style="--l:22"/>
  </g>

  <!-- bottom strip separators -->
  <g class="thin">
    <path d="M212 731 L222 731" marker-end="url(#ah)"/>
    <path d="M366 731 L376 731" marker-end="url(#ah)"/>
    <path d="M540 731 L550 731" marker-end="url(#ah)"/>
    <path d="M756 731 L766 731" marker-end="url(#ah)"/>
    <path d="M986 714 L1014 714"/>
    <path d="M986 744 L1014 744" stroke-dasharray="7 5"/>
  </g>
</g>

<!-- ══════════════ text (crisp) ══════════════ -->
<g>
  <text class="h1" x="40" y="52">verboseless</text>
  <text class="sub" x="238" y="52">two axes, one cat</text>
  <text class="sm" x="1240" y="38" text-anchor="end">essence first · say less</text>
  <text class="sm" x="1240" y="56" text-anchor="end">claude code plugin · MIT</text>

  <text class="num" x="66" y="135" text-anchor="middle">1</text>
  <text class="pt" x="90" y="136">on disk</text>
  <text class="lb" x="70" y="182">00-doctrine.md</text>          <text class="sm" x="270" y="182" text-anchor="end">1.9 KB</text>
  <text class="lb" x="70" y="228">01-essence-first.md</text>       <text class="sm" x="270" y="228" text-anchor="end">6.5 KB</text>
  <text class="lb" x="70" y="274">02-say-less.md</text>          <text class="sm" x="270" y="274" text-anchor="end">3.3 KB</text>
  <text class="sm" x="70" y="320">3 personas · 2 axes · 11.7 KB</text>
  <text class="sm" x="58" y="356">glob order IS the axis order</text>
  <text class="sm" x="58" y="374">delete a file = that axis off</text>
  <text class="sm" x="58" y="392">no config · no env var · no state</text>

  <text class="num" x="342" y="135" text-anchor="middle">2</text>
  <text class="pt" x="366" y="136">one hook</text>
  <text class="mono" x="348" y="183">cat personas/*.md</text>
  <text class="sm" x="334" y="222">all three events accept plain stdout</text>
  <text class="sm" x="334" y="238">as context — so no JSON, no escaping</text>
  <text class="lb" x="378" y="266">SessionStart</text>
  <text class="sm" x="620" y="266" text-anchor="end">full · + compaction</text>
  <text class="lb" x="378" y="308">UserPromptSubmit</text>
  <text class="sm" x="620" y="308" text-anchor="end">1 line · per prompt</text>
  <text class="lb" x="378" y="350">SubagentStart</text>
  <text class="sm" x="620" y="350" text-anchor="end">full · per subagent</text>
  <text class="sm" x="334" y="392">22 lines, of which one is the mechanism</text>

  <text class="num" x="682" y="135" text-anchor="middle">3</text>
  <text class="pt" x="706" y="136">where it lands — the tail, not the head</text>
  <text class="sm decay" x="730" y="179">system prompt</text>
  <text class="sm decay" x="730" y="195">CLAUDE.md · output style</text>
  <text class="sm" x="730" y="240">turn 1</text>
  <text class="sm" x="730" y="318">turn N</text>
  <text class="lb accy refire" x="752" y="352">verboseless, re-injected</text>
  <text class="sm accy refire" x="752" y="370">11.7 KB, beside the live turn</text>

  <text class="lb" x="952" y="174">stated ONCE, at the head</text>
  <text class="sm" x="952" y="192">cached — salience decays as</text>
  <text class="sm" x="952" y="208">the transcript grows past it</text>
  <text class="lb accy" x="952" y="342">RE-stated at the tail</text>
  <text class="sm" x="952" y="360">every prompt, and again</text>
  <text class="sm" x="952" y="376">after every compaction</text>
  <text class="sm" x="666" y="400">same words · different position · the repetition is the forcing function</text>

  <text class="num" x="66" y="463" text-anchor="middle">4</text>
  <text class="pt" x="90" y="464">three personas, three surfaces — in this order</text>
  <text class="lb" x="70" y="515">the FIRST LINE</text>       <text class="lb accy" x="274" y="515">abstract first</text>
  <text class="sm" x="434" y="509">name the big idea</text>   <text class="sm" x="434" y="525">then stop, and let them pull detail</text>
  <text class="lb" x="70" y="571">the NEXT LINE</text>        <text class="lb accy" x="274" y="571">i-have-adhd</text>
  <text class="sm" x="434" y="565">the one thing to do now</text> <text class="sm" x="434" y="581">numbered if there are several</text>
  <text class="lb" x="70" y="627">everything you SAY</text>   <text class="lb accy" x="274" y="627">caveman</text>
  <text class="sm" x="434" y="621">terse prose, no filler</text> <text class="sm" x="434" y="637">exact errors stay verbatim</text>
  <text class="sm" x="58" y="666">you cannot compress an idea you have not named — altitude, then the move, then the words</text>

  <text class="num" x="800" y="463" text-anchor="middle">5</text>
  <text class="pt" x="824" y="464">measured · n=3 · prior arm</text>
  <text class="big" x="1226" y="466" text-anchor="end">−29%</text>
  <text class="lb" x="902" y="526" text-anchor="end">cost</text>
  <text class="sm" x="1162" y="516">$4.74</text>
  <text class="sm accy" x="1162" y="534">$3.37</text>
  <text class="lb" x="902" y="588" text-anchor="end">output</text>
  <text class="sm" x="1162" y="578">132.5k</text>
  <text class="sm accy" x="1162" y="596">89.5k</text>
  <text class="lb" x="902" y="650" text-anchor="end">variance</text>
  <text class="sm" x="1162" y="640">±.89</text>
  <text class="sm accy" x="1162" y="658">±.08</text>
  <text class="sm" x="790" y="676">ponytail + caveman, the cut this repo shipped before</text>

  <text class="lb" x="58" y="736">1 · three bodies</text>
  <text class="lb" x="232" y="736">2 · one cat</text>
  <text class="lb" x="386" y="736">3 · injected at the tail</text>
  <text class="lb" x="560" y="736">4 · first line · next line · prose</text>
  <text class="lb accy" x="776" y="736">5 · −29% (prior arm)</text>
  <text class="sm" x="1022" y="718">every prompt</text>
  <text class="sm" x="1022" y="748">once per session</text>
</g>
</svg>
